spring:
  application:
    name: TrackDrop
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/trackdrop}
    username: ${POSTGRES_USER:trackdrop}
    password: ${POSTGRES_PASSWORD:trackdrop}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  session:
    timeout: 7d
    jdbc:
      initialize-schema: never
  web:
    resources:
      add-mappings: true

server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        name: TRACKDROP_SESSION
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

trackdrop:
  features:
    reports-enabled: ${REPORTS_ENABLED:true}
  moderation:
    report-limit: ${REPORT_LIMIT:3}
  ranking:
    cron: "${RANKING_SNAPSHOT_CRON:0 0 0 * * *}"
  security:
    admin-emails: ${ADMIN_EMAILS:}
    ip-hash-secret: ${IP_HASH_SECRET:trackdrop-local-development-secret}
    remember-me-seconds: 604800
  supabase:
    url: ${SUPABASE_URL:http://127.0.0.1:54321}
    publishable-key: ${SUPABASE_PUBLISHABLE_KEY:local-development-publishable-key}
    secret-key: ${SUPABASE_SECRET_KEY:}
    email-redirect-url: ${AUTH_EMAIL_REDIRECT_URL:${RENDER_EXTERNAL_URL:http://127.0.0.1:5173}/login?verified=1}
    password-recovery-redirect-url: ${AUTH_PASSWORD_RECOVERY_REDIRECT_URL:${RENDER_EXTERNAL_URL:http://127.0.0.1:5173}/recover/password}
  music:
    apple:
      base-url: ${APPLE_ITUNES_BASE_URL:https://itunes.apple.com}
      storefront: KR
      fallback-storefront: US
      result-limit: 20
      calls-per-minute: 15
      cache-ttl: 5m
      cache-maximum-size: 500
      connect-timeout: 2s
      read-timeout: 12s

management:
  endpoints:
    web:
      exposure:
        include: health,info
