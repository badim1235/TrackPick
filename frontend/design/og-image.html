<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: "Wanted Sans";
        src: url("../public/fonts/WantedSansVariable.woff2") format("woff2-variations");
        font-style: normal;
        font-weight: 400 1000;
      }

      * { box-sizing: border-box; }

      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        color: #1c1c1c;
        background: #f7f4ed;
        font-family: "Wanted Sans", sans-serif;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 34px;
      }

      .mark {
        width: 166px;
        height: 166px;
        display: block;
        object-fit: contain;
      }

      .name {
        font-size: 104px;
        font-weight: 900;
        letter-spacing: 0;
        line-height: 1;
      }
    </style>
  </head>
  <body>
    <div class="brand">
      <img class="mark" src="../public/trackpick-logo.png" alt="" />
      <div class="name">TrackPick</div>
    </div>
  </body>
</html>
