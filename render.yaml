services:
  - type: web
    name: trackdrop
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: AUTH_EMAIL_REDIRECT_URL
        value: https://trackpick.net/login?verified=1
      - key: AUTH_PASSWORD_RECOVERY_REDIRECT_URL
        value: https://trackpick.net/recover/password
      - key: ADMIN_EMAILS
        sync: false
      - key: REPORT_LIMIT
        value: "3"
      - key: REPORTS_ENABLED
        value: "true"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: IP_HASH_SECRET
        generateValue: true
      - key: SERVER_FORWARD_HEADERS_STRATEGY
        value: framework
      - key: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
        value: "5"
      - key: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
        value: "0"
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError
